<!doctype html>
<html lang="{{ site.lang | default: 'pl-PL' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="theme-color" content="#f8f7f3">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — RSS" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Grzegorz Pawłowski — strona główna">
          <img src="{{ '/assets/images/site-logo.png' | relative_url }}" width="44" height="44" alt="" class="brand-mark">
          <span><strong>Grzegorz Pawłowski</strong><small>Praktycznie o IT</small></span>
        </a>
        <nav aria-label="Nawigacja główna">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/o-mnie/' | relative_url }}"{% if page.url == '/o-mnie/' %} aria-current="page"{% endif %}>O mnie</a>
          <a href="mailto:kontakt@grzegorzpawlowski.pl">Kontakt</a>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© {{ 'now' | date: '%Y' }} Grzegorz Pawłowski</span>
        <div><a href="mailto:kontakt@grzegorzpawlowski.pl">Napisz do mnie</a><a href="https://www.linkedin.com/in/grzegorzpawlowski93/">LinkedIn</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
      </div>
    </footer>
  </body>
</html>
